onboarding = false

[theme]
name = "terminal"

[theme.custom]
sidebar_bg = "#000000"
panel_bg = "#000000"
active_row_bg = "#202020"
selection_bg = "#303030"

[ui]
tab_bar_right = [{ type = "datetime", format = "[ %H:%M ]" }]
sidebar_collapsed_mode = "hidden"
pane_scrollbars = false

[keys]
prefix = "ctrl+a"

# Split
split_horizontal = "prefix+s"
split_vertical = "prefix+v"

# Vim-style pane navigation
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# Resize
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"

# Tab navigation without prefix
previous_tab = "alt+h"
next_tab = "alt+l"

# Agent navigation after prefix
previous_agent = "prefix+ctrl+p"
next_agent = "prefix+ctrl+n"
focus_agent = "prefix+ctrl+1..9"

# Reload config
reload_config = "prefix+a"
